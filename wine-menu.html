let curArch = null;
const grid = document.getElementById('mbtiGrid');
Object.keys(MAP).forEach(m => {
    const b = document.createElement('div');
    b.className = 'mbti-btn'; b.textContent = m;
    b.onclick = () => {
        document.querySelectorAll('.mbti-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        curArch = MAP[m];
        const meta = ARCH_META[curArch];
        const line = document.getElementById('archLine');
        line.classList.add('show');
        line.innerHTML = m + ' → <b style="color:' + meta[2] + '">' + meta[1] + ' ' + meta[0] + '</b> · 金色标记的酒与你亲和';
        render();
    };
    grid.appendChild(b);
});

function topFlavors(f) {
    return Object.entries(f).filter(([k,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,4);
}

function render() {
    const g = document.getElementById('cockGrid');
    g.innerHTML = '';
    DATA.forEach(c => {
        const matched = curArch && c.affinity.includes(curArch);
        const card = document.createElement('div');
        card.className = 'cock-card' + (matched ? ' matched' : '');
        card.style.setProperty('--ac', c.auraColor || '#a78bfa');
        const fls = topFlavors(c.flavor).map(([k,v]) =>
            '<div class="fl-row"><span class="nm">' + FL_NM[k] + '</span>' +
            '<div class="fl-bar"><div class="fl-fill" style="width:' + (v*10) + '%"></div></div></div>'
        ).join('');
        const ings = c.ingredients.map(i => i.name + ' · ' + i.amount).join('<br>');
        card.innerHTML =
            '<div class="aura"></div>' +
            '<div class="cock-name">' + c.name + '<span class="match-badge">◆ 与你亲和</span></div>' +
            '<div class="cock-en">' + c.nameEn + ' · ' + c.baseSpirit + '</div>' +
            '<div class="cock-tag">「' + c.tagline + '」</div>' +
            '<div class="cock-meta"><span>ABV ' + c.abv + '%</span><span>' + c.category + '</span><span>难度 ' + '★'.repeat(c.difficulty) + '</span></div>' +
            '<div class="flavors">' + fls + '</div>' +
            '<div class="cock-detail">' +
                '<div class="cock-story">' + c.story + '</div>' +
                '<div class="cock-ings"><b>配方 RECIPE</b>' + ings + '<br><br>杯具：' + c.glass + ' · 装饰：' + c.garnish + '</div>' +
            '</div>';
        card.onclick = () => card.classList.toggle('open');
        g.appendChild(card);
    });
}
render();

// 星空
(function() {
    const c = document.getElementById('stars'), x = c.getContext('2d');
    function rs() { c.width = innerWidth; c.height = innerHeight; }
    rs(); addEventListener('resize', rs);
    const ss = Array.from({length: 120}, () => ({
        x: Math.random()*c.width, y: Math.random()*c.height,
        r: Math.random()*1.1+0.2, a: Math.random(), s: Math.random()*0.02+0.005,
        c: ['#ffffff','#c7d2fe','#93c5fd','#c4b5fd'][Math.floor(Math.random()*4)]
    }));
    (function draw() {
        x.clearRect(0,0,c.width,c.height);
        ss.forEach(s => {
            s.a += s.s; if (s.a > 1 || s.a < 0) s.s = -s.s;
            x.globalAlpha = Math.max(0.1, s.a); x.fillStyle = s.c;
            x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI*2); x.fill();
        });
        requestAnimationFrame(draw);
    })();
})();
</script>
