<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 人格面具双面镜 · 罗煜</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
<style>
    /* ================================================================
       🎨 视觉升级 · MindArena 暗黑紫蓝体系 + 动效增强
       ================================================================ */
    :root {
        --bg-deep: #060a1f;
        --bg-mid: #0a0f2c;
        --bg-card: rgba(10, 8, 12, 0.5);
        --border-glow: rgba(167, 139, 250, 0.06);
        --border-active: rgba(167, 139, 250, 0.15);
        --cyan: #22d3ee;
        --purple: #a78bfa;
        --gold: #e3b341;
        --pink: #f472b6;
        --t1: #e8edff;
        --t2: #94a3b8;
        --t3: #4a5580;
        --shadow-card: 0 8px 60px rgba(0, 0, 0, 0.4);
        --radius-card: 14px;
        --transition-smooth: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: var(--bg-deep);
        color: var(--t1);
        min-height: 100vh;
        padding: 32px 20px 60px;
        display: flex;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
    }

    /* ===== 动态星空背景 ===== */
    #stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.6;
    }

    .wrap {
        max-width: 720px;
        width: 100%;
        position: relative;
        z-index: 1;
    }

    /* ===== 返回按钮 ===== */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--t2);
        text-decoration: none;
        border: 1px solid rgba(167, 139, 250, 0.06);
        padding: 6px 18px;
        border-radius: 999px;
        margin-bottom: 28px;
        transition: var(--transition-smooth);
        background: rgba(10, 8, 12, 0.4);
        backdrop-filter: blur(8px);
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
    }
    .back-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(34,211,238,0.02), transparent);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    .back-btn:hover::before {
        transform: translateX(100%);
    }
    .back-btn:hover {
        color: var(--cyan);
        border-color: rgba(34, 211, 238, 0.2);
        transform: translateX(-3px);
        box-shadow: 0 0 30px rgba(34, 211, 238, 0.02);
    }

    /* ===== 页面标题 ===== */
    .page-title {
        text-align: center;
        margin-bottom: 12px;
        animation: fadeDown 0.8s ease;
    }
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-16px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .page-title h1 {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--t1) 40%, var(--purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 60px rgba(167, 139, 250, 0.05);
        animation: shimmer 4s ease-in-out infinite alternate;
    }
    @keyframes shimmer {
        0% { filter: brightness(1); }
        100% { filter: brightness(1.1); }
    }
    .page-title .sub {
        font-size: 13px;
        color: var(--t2);
        margin-top: 8px;
        line-height: 1.8;
        letter-spacing: 1px;
        opacity: 0.6;
    }
    .page-title .sub .highlight {
        color: var(--purple);
        opacity: 1;
        animation: pulseText 3s ease-in-out infinite;
    }
    @keyframes pulseText {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
    }

    /* ===== 概念说明 ===== */
    .concept {
        margin: 24px 0 30px;
        padding: 20px 24px;
        border: 1px solid rgba(167, 139, 250, 0.04);
        border-radius: var(--radius-card);
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow-card);
        font-size: 13.5px;
        line-height: 2;
        color: var(--t2);
        transition: var(--transition-smooth);
        animation: fadeUp 0.8s ease 0.1s both;
        position: relative;
        overflow: hidden;
    }
    .concept::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 20%, rgba(167,139,250,0.02), transparent 60%);
        pointer-events: none;
        animation: slowRotate 30s linear infinite;
    }
    @keyframes slowRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .concept:hover {
        border-color: rgba(167, 139, 250, 0.06);
        transform: translateY(-2px);
        box-shadow: 0 12px 60px rgba(0, 0, 0, 0.5);
    }
    .concept b {
        color: var(--t1);
        font-weight: 600;
    }
    .concept .mask {
        color: var(--gold);
        font-weight: 500;
        display: inline-block;
        animation: glowMask 4s ease-in-out infinite;
    }
    @keyframes glowMask {
        0%, 100% { text-shadow: 0 0 10px rgba(227,179,65,0.0); }
        50% { text-shadow: 0 0 20px rgba(227,179,65,0.1); }
    }
    .concept .real {
        color: var(--cyan);
        font-weight: 500;
        display: inline-block;
        animation: glowReal 4s ease-in-out infinite 0.5s;
    }
    @keyframes glowReal {
        0%, 100% { text-shadow: 0 0 10px rgba(34,211,238,0.0); }
        50% { text-shadow: 0 0 20px rgba(34,211,238,0.1); }
    }
    .concept .divider-line {
        display: inline-block;
        width: 2px;
        height: 14px;
        background: rgba(167, 139, 250, 0.06);
        margin: 0 8px;
        vertical-align: middle;
    }

    /* ===== MBTI 网格 ===== */
    .mbti-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 30px;
        animation: fadeUp 0.8s ease 0.2s both;
    }
    .mbti-btn {
        padding: 12px 0;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--t2);
        cursor: pointer;
        border: 1px solid rgba(167, 139, 250, 0.04);
        border-radius: 10px;
        background: var(--bg-card);
        backdrop-filter: blur(8px);
        transition: var(--transition-smooth);
        user-select: none;
        box-shadow: var(--shadow-card);
        font-family: inherit;
        position: relative;
        overflow: hidden;
    }
    .mbti-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 0%, rgba(167, 139, 250, 0.02), transparent 70%);
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }
    .mbti-btn::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mbti-btn:hover::before {
        opacity: 1;
    }
    .mbti-btn:hover {
        border-color: rgba(167, 139, 250, 0.12);
        color: var(--t1);
        transform: translateY(-2px);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }
    .mbti-btn.active {
        border-color: var(--gold);
        color: var(--gold);
        background: rgba(227, 179, 65, 0.04);
        box-shadow: 0 0 40px rgba(227, 179, 65, 0.03), 0 8px 40px rgba(0, 0, 0, 0.3);
        transform: translateY(-2px);
        animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mbti-btn.active::after {
        width: 60%;
    }
    @keyframes pop {
        0% { transform: scale(0.95) translateY(0); }
        100% { transform: scale(1) translateY(-2px); }
    }
    /* 涟漪效果 */
    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(227,179,65,0.05);
        transform: scale(0);
        animation: rippleAnim 0.6s ease-out forwards;
        pointer-events: none;
    }
    @keyframes rippleAnim {
        to { transform: scale(4); opacity: 0; }
    }

    /* ===== 结果容器 ===== */
    .result {
        display: none;
        animation: fadeUp 0.6s ease;
    }
    .result.show {
        display: block;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 主卡片 ===== */
    .arch-card {
        border-radius: 18px;
        padding: 28px 26px 24px;
        border: 1px solid rgba(167, 139, 250, 0.04);
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        box-shadow: var(--shadow-card);
        position: relative;
        overflow: hidden;
        transition: var(--transition-smooth);
        animation: cardEntrance 0.8s ease both;
    }
    @keyframes cardEntrance {
        from { opacity: 0; transform: translateY(30px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .arch-card:hover {
        border-color: rgba(167, 139, 250, 0.06);
        transform: translateY(-2px);
        box-shadow: 0 12px 80px rgba(0, 0, 0, 0.5);
    }
    .arch-card .glow {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        pointer-events: none;
        background: radial-gradient(80% 100% at 50% 0%, var(--ac, #a78bfa), transparent 70%);
        transition: opacity 0.8s ease, transform 0.8s ease;
        transform: scale(1);
    }
    .arch-card:hover .glow {
        opacity: 0.12;
        transform: scale(1.05);
    }

    .arch-head {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 6px;
        position: relative;
        flex-wrap: wrap;
    }
    .arch-emoji {
        font-size: 44px;
        line-height: 1;
        filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.05));
        transition: var(--transition-smooth);
        animation: floatEmoji 4s ease-in-out infinite;
    }
    @keyframes floatEmoji {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.02); }
    }
    .arch-name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        transition: var(--transition-smooth);
    }
    .arch-tag {
        font-size: 12px;
        color: var(--t2);
        margin-top: 2px;
        opacity: 0.6;
        letter-spacing: 1px;
    }
    .side-pill {
        margin-left: auto;
        font-size: 10px;
        letter-spacing: 1.5px;
        color: var(--gold);
        border: 1px solid rgba(227, 179, 65, 0.15);
        padding: 3px 14px;
        border-radius: 999px;
        white-space: nowrap;
        background: rgba(227, 179, 65, 0.02);
        backdrop-filter: blur(4px);
        transition: var(--transition-smooth);
        animation: pillPulse 3s ease-in-out infinite;
    }
    @keyframes pillPulse {
        0%, 100% { border-color: rgba(227,179,65,0.15); }
        50% { border-color: rgba(227,179,65,0.3); }
    }

    .arch-desc {
        font-size: 14px;
        color: var(--t2);
        line-height: 1.9;
        margin: 12px 0 22px;
        position: relative;
        padding-left: 2px;
    }
    .arch-desc i {
        color: var(--t1);
        font-style: normal;
        font-weight: 500;
    }
    .arch-desc .highlight-name {
        color: var(--purple);
        font-weight: 500;
    }

    /* ===== 六维条形图 ===== */
    .dims {
        position: relative;
    }
    .dim-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        padding: 2px 0;
        opacity: 0;
        animation: dimAppear 0.5s ease forwards;
    }
    .dim-row:nth-child(1) { animation-delay: 0.05s; }
    .dim-row:nth-child(2) { animation-delay: 0.10s; }
    .dim-row:nth-child(3) { animation-delay: 0.15s; }
    .dim-row:nth-child(4) { animation-delay: 0.20s; }
    .dim-row:nth-child(5) { animation-delay: 0.25s; }
    .dim-row:nth-child(6) { animation-delay: 0.30s; }

    @keyframes dimAppear {
        from { opacity: 0; transform: translateX(-12px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .dim-label {
        width: 86px;
        font-size: 12px;
        color: var(--t2);
        flex-shrink: 0;
        letter-spacing: 0.5px;
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .dim-label .dim-icon {
        font-size: 14px;
        transition: var(--transition-smooth);
    }
    .dim-row:hover .dim-icon {
        transform: scale(1.2);
    }
    .dim-bar {
        flex: 1;
        height: 6px;
        border-radius: 99px;
        background: rgba(255,255,255,0.03);
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255,255,255,0.02);
    }
    .dim-fill {
        height: 100%;
        border-radius: 99px;
        width: 0;
        transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
    }
    .dim-fill::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12));
        border-radius: 99px;
    }
    .dim-fill.loading {
        animation: loadingPulse 0.6s ease 2;
    }
    @keyframes loadingPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .dim-val {
        width: 34px;
        font-size: 11px;
        color: var(--t3);
        text-align: right;
        font-family: 'SF Mono', 'Courier New', monospace;
        font-weight: 400;
        letter-spacing: 0.5px;
        transition: var(--transition-smooth);
    }
    .dim-row:hover .dim-val {
        color: var(--t2);
    }

    /* ===== 真实人格侧 ===== */
    .real-side {
        margin-top: 22px;
        padding: 16px 20px;
        border-radius: 12px;
        border: 1px solid rgba(34, 211, 238, 0.08);
        background: rgba(34, 211, 238, 0.02);
        font-size: 13px;
        line-height: 1.9;
        color: var(--t2);
        transition: var(--transition-smooth);
        position: relative;
        overflow: hidden;
        animation: realAppear 0.6s ease 0.4s both;
    }
    @keyframes realAppear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .real-side::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 70% 30%, rgba(34,211,238,0.02), transparent 60%);
        pointer-events: none;
        animation: slowRotate 25s linear infinite reverse;
    }
    .real-side:hover {
        border-color: rgba(34, 211, 238, 0.15);
        background: rgba(34, 211, 238, 0.03);
        transform: translateY(-1px);
        box-shadow: 0 8px 30px rgba(34, 211, 238, 0.02);
    }
    .real-side b {
        color: var(--cyan);
        font-weight: 600;
    }
    .real-side a {
        color: var(--cyan);
        text-decoration: none;
        border-bottom: 1px dashed rgba(34, 211, 238, 0.15);
        transition: var(--transition-smooth);
        font-weight: 500;
        position: relative;
    }
    .real-side a::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 0;
        height: 1px;
        background: var(--cyan);
        transition: width 0.3s ease;
    }
    .real-side a:hover::after {
        width: 100%;
    }
    .real-side a:hover {
        color: #67e8f9;
        border-bottom-color: rgba(34, 211, 238, 0.3);
    }
    .real-side .real-icon {
        color: var(--cyan);
        font-size: 16px;
    }

    /* ===== 底部 ===== */
    .footer-note {
        text-align: center;
        margin-top: 40px;
        font-size: 11px;
        color: var(--t3);
        font-family: 'SF Mono', 'Courier New', monospace;
        letter-spacing: 2px;
        opacity: 0.3;
        padding-top: 16px;
        border-top: 1px solid rgba(167, 139, 250, 0.02);
        animation: fadeUp 0.8s ease 0.6s both;
    }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.08); border-radius: 2px; }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
        .mbti-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .mbti-btn {
            font-size: 12px;
            padding: 10px 0;
            border-radius: 8px;
        }
        .arch-head {
            gap: 12px;
        }
        .arch-emoji {
            font-size: 34px;
        }
        .arch-name {
            font-size: 20px;
        }
        .arch-card {
            padding: 20px 16px 18px;
            border-radius: 14px;
        }
        .dim-label {
            width: 70px;
            font-size: 11px;
        }
        .dim-label .dim-icon {
            font-size: 12px;
        }
        .dim-val {
            font-size: 10px;
            width: 28px;
        }
        .side-pill {
            font-size: 9px;
            padding: 2px 10px;
            margin-left: 0;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }
        .arch-head {
            flex-wrap: wrap;
        }
        .concept {
            padding: 16px 18px;
            font-size: 12.5px;
        }
        .page-title h1 {
            font-size: 24px;
        }
        .real-side {
            font-size: 12px;
            padding: 14px 16px;
        }
        body {
            padding: 20px 12px 40px;
        }
    }

    @media (max-width: 400px) {
        .mbti-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .mbti-btn {
            font-size: 10px;
            padding: 8px 0;
            border-radius: 6px;
        }
        .dim-label {
            width: 56px;
            font-size: 10px;
        }
        .dim-label .dim-icon {
            font-size: 10px;
        }
        .arch-name {
            font-size: 17px;
        }
        .arch-emoji {
            font-size: 28px;
        }
        .arch-card {
            padding: 16px 12px 14px;
        }
    }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrap">

    <!-- ===== 返回按钮 ===== -->
    <a href="index.html" class="back-btn">← 返回首页</a>

    <!-- ===== 页面标题 ===== -->
    <div class="page-title">
        <h1>🎭 人格面具双面镜</h1>
        <div class="sub">
            16 型 MBTI × 11 种原型 · 六维向量<br>
            <span class="highlight">我的人格引擎 IP 核心模型</span>
        </div>
    </div>

    <!-- ===== 概念说明 ===== -->
    <div class="concept">
        每个人都戴着两层面孔：<br>
        <span class="mask">◐ 社交面具</span> = 自评 MBTI 映射出的原型 —— <b>你说的你</b>；<br>
        <span class="real">◑ 真实人格</span> = 11 维行为向量计算出的原型 —— <b>你的行为说的你</b>。<br>
        两面镜子叠在一起，差异本身就是最诚实的人格报告。
    </div>

    <!-- ===== MBTI 网格 ===== -->
    <div class="mbti-grid" id="mbtiGrid"></div>

    <!-- ===== 结果 ===== -->
    <div class="result" id="result">
        <div class="arch-card">
            <div class="glow" id="glow"></div>

            <div class="arch-head">
                <div class="arch-emoji" id="aEmoji"></div>
                <div>
                    <div class="arch-name" id="aName"></div>
                    <div class="arch-tag" id="aTag"></div>
                </div>
                <span class="side-pill">◐ 社交面具侧</span>
            </div>

            <div class="arch-desc" id="aDesc"></div>

            <div class="dims" id="dims"></div>

            <div class="real-side">
                <span class="real-icon">◑</span>
                <b>真实人格侧</b>：由调酒选择、牌桌决策等真实行为沉淀的 11 维向量实时计算，
                与面具侧叠合生成「双面差异报告」。完整交互在
                <a href="https://hellomind-star.github.io/finance-personality/" target="_blank">人格金融孪生平台 · 人格护照</a> 在线体验 →
            </div>
        </div>
    </div>

    <div class="footer-note">Y.Mine 人格实验室 · 双面模型 v1</div>

</div>

<script>
    // ================================================================
    //  🎭 人格面具双面镜 · 核心引擎（逻辑完全保留）
    // ================================================================

    const DIMS = [
        { key: 'TOL', name: '容忍度', icon: '🧘', color: '#A78BFA' },
        { key: 'SPD', name: '速度',   icon: '⚡', color: '#22D3EE' },
        { key: 'INF', name: '影响力', icon: '🧠', color: '#FBBF24' },
        { key: 'ENT', name: '能量',   icon: '🔥', color: '#F87171' },
        { key: 'LEAD', name: '主导性', icon: '👑', color: '#34D399' },
        { key: 'VIS', name: '视觉性', icon: '👁️', color: '#F472B6' },
    ];

    const ARCH = {
        dreamweaver: { name: '织梦者', emoji: '🌙', color: '#9d6bbf', desc: '以直觉为线，编织夜的经纬。', tag: '把未饮过的味道，织进今夜的星图。',
            v: { TOL: .55, SPD: .45, INF: .70, ENT: .65, LEAD: .40, VIS: .85 } },
        clockmaker: { name: '守序者', emoji: '⚙️', color: '#f0c674', desc: '每一滴都落在它该落的分毫里。', tag: '秩序即安全感，分毫不差即浪漫。',
            v: { TOL: .35, SPD: .30, INF: .80, ENT: .20, LEAD: .75, VIS: .30 } },
        ember: { name: '焰心者', emoji: '🔥', color: '#F87171', desc: '把热度分给世界的每一寸。', tag: '你举杯，整张吧台都跟着亮起来。',
            v: { TOL: .40, SPD: .75, INF: .35, ENT: .90, LEAD: .55, VIS: .60 } },
        velvet: { name: '月潮者', emoji: '🌊', color: '#22D3EE', desc: '随月盈缺，温柔却不可挡。', tag: '把锋芒藏进丝绒，让夜柔软下来。',
            v: { TOL: .70, SPD: .50, INF: .55, ENT: .60, LEAD: .35, VIS: .70 } },
        mistwalker: { name: '雾行者', emoji: '🌫️', color: '#8B8FB8', desc: '在朦胧中辨认方向的人。', tag: '心事被风一吹，便起了涟漪。',
            v: { TOL: .60, SPD: .40, INF: .50, ENT: .35, LEAD: .45, VIS: .55 } },
        alchemist: { name: '炼金者', emoji: '⚗️', color: '#A78BFA', desc: '把纷繁炼至两样材料。', tag: '以耐心炼新奇，把灵感炼成经典。',
            v: { TOL: .80, SPD: .55, INF: .85, ENT: .30, LEAD: .60, VIS: .45 } },
        solitude: { name: '独酌者', emoji: '🌑', color: '#6a6a8a', desc: '夜将尽，留一句给你独听。', tag: '角落那杯，是只有自己懂的语言。',
            v: { TOL: .50, SPD: .35, INF: .60, ENT: .25, LEAD: .30, VIS: .40 } },
        navigator: { name: '引航者', emoji: '🧭', color: '#c8a040', desc: '风浪里端得住一杯不洒，便是你的航向。', tag: '方向感，是扛出来的。',
            v: { TOL: .50, SPD: .70, INF: .55, ENT: .40, LEAD: .80, VIS: .45 } },
        revel: { name: '夜宴者', emoji: '🥂', color: '#b06fc8', desc: '热烈是底色，锋芒是装饰。', tag: '把每一晚都过成庆典。',
            v: { TOL: .40, SPD: .65, INF: .25, ENT: .85, LEAD: .55, VIS: .70 } },
        twilight: { name: '暮色者', emoji: '🌅', color: '#FBBF24', desc: '天光与夜色交接处的人。', tag: '不偏不倚，恰是夜与昼交界的颜色。',
            v: { TOL: .45, SPD: .60, INF: .45, ENT: .55, LEAD: .50, VIS: .65 } },
        nightcaller: { name: '夜唤者', emoji: '🦉', color: '#7C5FBF', desc: '在子夜唤醒沉睡的思想。', tag: '在子夜，把沉睡的思想一一唤醒。',
            v: { TOL: .65, SPD: .70, INF: .65, ENT: .75, LEAD: .70, VIS: .75 } },
    };

    const MAP = {
        INTJ: 'alchemist', INTP: 'alchemist', ENTJ: 'nightcaller', ENTP: 'nightcaller',
        INFJ: 'dreamweaver', INFP: 'dreamweaver', ENFJ: 'ember', ENFP: 'ember',
        ISTJ: 'clockmaker', ISFJ: 'clockmaker', ESTJ: 'navigator', ESFJ: 'navigator',
        ISTP: 'velvet', ISFP: 'mistwalker', ESTP: 'revel', ESFP: 'revel',
    };

    // ---- 渲染 MBTI 网格 ----
    const grid = document.getElementById('mbtiGrid');
    Object.keys(MAP).forEach(m => {
        const b = document.createElement('div');
        b.className = 'mbti-btn';
        b.textContent = m;
        b.onclick = (e) => {
            // 涟漪效果
            const rect = b.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
            b.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
            select(m, b);
        };
        grid.appendChild(b);
    });

    // ---- 选择逻辑 ----
    function select(mbti, btn) {
        document.querySelectorAll('.mbti-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');

        const a = ARCH[MAP[mbti]];
        const result = document.getElementById('result');
        result.classList.add('show');

        const glow = document.getElementById('glow');
        glow.style.setProperty('--ac', a.color);

        document.getElementById('aEmoji').textContent = a.emoji;
        document.getElementById('aName').textContent = a.name;
        document.getElementById('aName').style.color = a.color;
        document.getElementById('aTag').textContent = a.tag;
        document.getElementById('aDesc').innerHTML =
            mbti + ' 的社交面具是 <i class="highlight-name">「' + a.name + '」</i> —— ' + a.desc;

        const dims = document.getElementById('dims');
        dims.innerHTML = '';

        DIMS.forEach((d, index) => {
            const val = a.v[d.key];
            const row = document.createElement('div');
            row.className = 'dim-row';
            row.style.animationDelay = (0.05 + index * 0.05) + 's';
            row.innerHTML = `
                <span class="dim-label">
                    <span class="dim-icon">${d.icon}</span> ${d.name}
                </span>
                <div class="dim-bar">
                    <div class="dim-fill" style="background:${d.color};"></div>
                </div>
                <span class="dim-val">${Math.round(val * 100)}</span>
            `;
            dims.appendChild(row);

            requestAnimationFrame(() => {
                setTimeout(() => {
                    const fill = row.querySelector('.dim-fill');
                    if (fill) {
                        fill.style.width = (val * 100) + '%';
                        fill.classList.add('loading');
                        setTimeout(() => fill.classList.remove('loading'), 1200);
                    }
                }, 100 + index * 80);
            });
        });

        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ================================================================
    //  ✨ 星空背景（升级版 + 视差）
    // ================================================================
    (function() {
        const c = document.getElementById('stars');
        const x = c.getContext('2d');
        let stars = [];
        let mouseX = 0, mouseY = 0;

        function rs() {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            stars = Array.from({ length: 140 }, () => ({
                x: Math.random() * c.width,
                y: Math.random() * c.height,
                r: Math.random() * 1.2 + 0.2,
                a: Math.random(),
                s: Math.random() * 0.025 + 0.005,
                c: ['#ffffff', '#c7d2fe', '#93c5fd', '#c4b5fd', '#a78bfa', '#22d3ee'][Math.floor(Math.random() * 6)],
                ox: 0, oy: 0,
                parallax: Math.random() * 0.3 + 0.1
            }));
        }
        rs();
        window.addEventListener('resize', rs);

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        (function draw() {
            x.clearRect(0, 0, c.width, c.height);
            stars.forEach(s => {
                s.a += s.s;
                if (s.a > 1 || s.a < 0) s.s = -s.s;
                x.globalAlpha = Math.max(0.08, s.a * 0.7);

                // 视差偏移
                const px = mouseX * s.parallax * 6;
                const py = mouseY * s.parallax * 6;

                x.fillStyle = s.c;
                x.shadowColor = s.c;
                x.shadowBlur = 4;
                x.beginPath();
                x.arc(s.x + px, s.y + py, s.r, 0, Math.PI * 2);
                x.fill();
            });
            x.shadowBlur = 0;
            requestAnimationFrame(draw);
        })();
    })();
</script>

</body>
